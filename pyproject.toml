[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gameday-intelligence"
version = "0.1.0"
description = "Live, verified, personalized football match intelligence from synthetic events."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0,<3",
    "pydantic>=2.8,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "websockets>=13,<16",
    "agent-framework-foundry>=1.15",
    "azure-identity>=1.26",
    "mcp>=2.2,<3",
    "tenacity>=9.1.4,<9.2",  # Agent Framework's MCP client reconnects with it
    "opentelemetry-sdk>=1.45,<2",  # collects Agent Framework spans for the trace panel
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["engine*", "agents*", "mcp_server*", "app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore:Using `httpx`"]
