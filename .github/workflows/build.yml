# Every push to main: run the tests and the dashboard build, then build the container image and
# publish it to GitHub Container Registry. Azure Container Apps runs that image.
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[dev]"
      - run: pytest
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --no-audit --no-fund && npm run build
        working-directory: web

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

  # Sign in to Azure with OIDC (no stored secret: Azure trusts this repo's main branch only) and
  # roll the Container App onto the image just built, then check it answers.
  deploy:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Roll out the new image
        run: |
          az extension add --name containerapp --only-show-errors
          az containerapp update -n gameday-intelligence -g "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "ghcr.io/${{ github.repository }}:${{ github.sha }}" --only-show-errors \
            --query properties.latestRevisionName -o tsv
      - name: Check the public app answers
        run: |
          url="https://$(az containerapp show -n gameday-intelligence -g "${{ vars.AZURE_RESOURCE_GROUP }}" --query properties.configuration.ingress.fqdn -o tsv)"
          for i in $(seq 1 30); do
            if curl -fsS "$url/api/health"; then echo; echo "live at $url"; exit 0; fi
            sleep 10
          done
          echo "the app did not answer within 5 minutes" && exit 1
